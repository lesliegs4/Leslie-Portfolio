name: Deploy to GitHub Pages

on:
  # Rebuild and redeploy every time you push to `main`
  push:
    branches: [main]
  # Lets you trigger a deploy by hand from the Actions tab on GitHub
  workflow_dispatch:

# Permissions the job needs to read the repo and publish a Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
      - name: Install, build, and upload your site
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
